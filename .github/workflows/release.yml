name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Packages
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel \
            cmake \
            ninja \
            extra-cmake-modules \
            fcitx5 \
            libinput \
            rust \
            git \
            nodejs

      - name: Cache Cargo & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            build/engine-target/
            build/ui-target/
          key: ${{ runner.os }}-build-arch-${{ hashFiles('engine/Cargo.lock', 'ui/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-arch-

      - name: Run engine tests
        run: cargo test --manifest-path engine/Cargo.toml --verbose

      - name: Build Clak
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)

      - name: Create release bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DESTDIR=/tmp/clak-dist cmake --install build
          mkdir -p dist
          tar -C /tmp/clak-dist -czf dist/clak-${VERSION}-linux-x86_64.tar.gz usr/

      - name: Create vendor tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cargo vendor vendor/ --manifest-path engine/Cargo.toml
          tar -czf dist/clak-${VERSION}-vendor.tar.gz vendor/
          rm -rf vendor/

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Generate Release Notes
        id: release-notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.release-notes.outputs.content }}
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Switch to main branch
        run: git checkout main

      - name: Update Full CHANGELOG
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --prepend CHANGELOG.md

      - name: Commit CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md unchanged, nothing to commit"
          else
            git commit -m "docs(changelog): update for ${GITHUB_REF_NAME} [skip ci]"
            git push origin main
          fi

  deploy-aur:
    name: Deploy to AUR
    needs: publish
    runs-on: ubuntu-latest
    env:
      AUR_KEY: ${{ secrets.AUR_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update PKGBUILD version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/aur/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" packaging/aur/PKGBUILD

      - name: Publish clak to AUR
        if: env.AUR_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: clak
          pkgbuild: packaging/aur/PKGBUILD
          commit_username: "verse"
          commit_email: "versedev.store@proton.me"
          ssh_private_key: ${{ secrets.AUR_KEY }}
          commit_message: "release: update to ${GITHUB_REF_NAME}"
